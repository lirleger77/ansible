---
- name: haproxy loadbalancer
  hosts: proxy
  become: true
  vars:
    haproxy_frontend_port: 80
    haproxy_backend_balance_method: roundrobin
    haproxy_backend_servers:
      - name: webserver1
        address: 192.168.124.129:80
      - name: webserver2
        address: 192.168.124.125:80
  tasks: 
    - name: allow http
      become: true
      firewalld:
        port: 80/tcp
        permanent: true
        state: enabled
  roles:
    - geerlingguy.haproxy
